<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CC Media Studio · Gallery</title><style>
:root{--bg:#f5f6fa;--ink:#25273d;--muted:#85899e;--purple:#6955df;--line:#e6e7ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.6 system-ui,sans-serif;color:var(--ink)}a{color:var(--purple);text-decoration:none}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}header{background:white;border-bottom:1px solid var(--line);padding:22px 5vw;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-size:19px;font-weight:750}.brand b{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--purple);color:white;border-radius:10px;margin-right:10px;font-size:13px}nav{display:flex;gap:22px;align-items:center}main{max-width:1370px;margin:48px auto;padding:0 36px}.eyebrow{color:var(--purple);font-size:11px;letter-spacing:2px;font-weight:700}h1{font-size:34px;letter-spacing:-1px;margin:9px 0}#intro{color:var(--muted);margin-bottom:28px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:white;border:1px solid var(--line);border-radius:15px;padding:15px}input,select{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:white;color:var(--ink)}#query{flex:1;min-width:180px}button,.download{border:1px solid var(--line);background:white;padding:9px 14px;border-radius:8px;color:var(--ink)}.primary,.download{background:var(--purple);border-color:var(--purple);color:white}#favorites[aria-pressed=true]{background:#f0ecff;color:var(--purple);border-color:#c7bdf3}.status{color:var(--muted);min-height:28px;margin:20px 0 12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{min-width:0;background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.visual{display:grid;place-items:center;position:relative;width:100%;aspect-ratio:1;border:0;border-radius:0;padding:0;background:linear-gradient(140deg,#ebe7ff,#dcecf0);overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.play{font-size:43px;color:var(--purple)}.type{position:absolute;left:12px;top:12px;background:#fffffff0;color:#605981;border-radius:6px;padding:3px 8px;font-size:10px;letter-spacing:1px}.body{padding:16px}.prompt{font-size:13px;height:42px;line-height:21px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin:0 0 12px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:8px}.favorite{border:0;padding:0 3px;color:var(--purple);font-size:18px}.more{text-align:center;margin:28px}#empty{text-align:center;padding:75px 16px;border:1px dashed #dcd7ef;border-radius:16px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:18px;padding:25px;width:min(1000px,94vw);max-height:92vh;color:var(--ink)}dialog::backdrop{background:#182033bb;backdrop-filter:blur(4px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog-head h2{font-size:18px;margin:0}.viewer{background:#141827;border-radius:12px;min-height:220px;display:grid;place-items:center}.viewer img,.viewer video{display:block;max-width:100%;max-height:58vh;margin:auto}.detail-prompt{white-space:pre-wrap;overflow-wrap:anywhere;max-height:130px;overflow:auto}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.danger{color:#c14f68;margin-left:auto}#detailMeta{color:var(--muted);font-size:12px;margin:15px 0}[hidden]{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){main{padding:0 18px;margin:30px auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}nav{gap:12px}h1{font-size:29px}.body{padding:12px}.toolbar{padding:12px}#query{flex-basis:100%}.meta{flex-wrap:wrap}.danger{margin-left:0}}@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style></head><body><header><a class="brand" href="/"><b>CC</b>Media Studio</a><nav><a href="/" id="imagesLink">图片工作台</a><a href="/video" id="videoLink">视频工作台</a><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></nav></header><main><span class="eyebrow">YOUR CREATIVE COLLECTION</span><h1 id="title">历史画廊</h1><p id="intro">每一次创作，都在这里。图片与视频保存在这台电脑，浏览作品不启动 GPU。</p><form class="toolbar" id="filters"><input id="query" maxlength="4000" placeholder="搜索画面描述…" aria-label="搜索 / Search"><select id="kind" aria-label="类型 / Type"><option value="all">全部作品</option><option value="image">图片</option><option value="video">视频</option></select><button id="favorites" type="button" aria-pressed="false">☆ 收藏</button><button id="search" class="primary">搜索</button><button id="refresh" type="button">刷新</button></form><p id="status" class="status" role="status" aria-live="polite"></p><div id="grid" class="grid"></div><div id="empty" hidden>还没有作品。生成的图片与视频会自动出现在这里。</div><div class="more"><button id="more" hidden>加载更多</button></div></main><dialog id="detail"><div class="dialog-head"><h2 id="detailTitle">作品预览</h2><button id="close" aria-label="关闭 / Close">✕</button></div><div id="viewer" class="viewer"></div><p id="detailPrompt" class="detail-prompt"></p><p id="detailMeta"></p><div class="actions"><a id="download" class="download" hidden>下载原文件</a><button id="copy">复制提示词</button><button id="star">☆ 收藏</button><button id="delete" class="danger">删除作品</button></div><p id="detailStatus" role="status"></p></dialog><script>
const nonce='__NONCE__',$=id=>document.getElementById(id);
const strings={zh:{imagesLink:'图片工作台',videoLink:'视频工作台',title:'历史画廊',intro:'每一次创作，都在这里。图片与视频保存在这台电脑，浏览作品不启动 GPU。',search:'搜索',refresh:'刷新',more:'加载更多',empty:'还没有作品。生成的图片与视频会自动出现在这里。',detailTitle:'作品预览',download:'下载原文件',copy:'复制提示词',delete:'删除作品',all:'全部作品',image:'图片',video:'视频',favorite:'☆ 收藏',starred:'★ 已收藏',loading:'正在读取作品…',failed:'无法读取历史。请重试；更新程序后请先停止旧后台，再启动客户端。',missing:'原文件已移走或删除',confirm:'删除这件作品及本机原文件？此操作无法撤销。',copied:'已复制提示词',copyFailed:'复制失败，请手动选中上方提示词。',count:(n,t)=>`已显示 ${n} / ${t} 件作品`},en:{imagesLink:'Images',videoLink:'Video',title:'Your gallery',intro:'Every creation, kept here. Images and videos stay on this computer. Browsing never starts a GPU.',search:'Search',refresh:'Refresh',more:'Load more',empty:'Your collection starts here. Generated images and videos will appear automatically.',detailTitle:'Preview',download:'Download original',copy:'Copy prompt',delete:'Delete work',all:'All works',image:'Images',video:'Videos',favorite:'☆ Favorites',starred:'★ Favorited',loading:'Loading your collection…',failed:'History is unavailable. Retry; after updating, stop the old worker and restart the app.',missing:'Original file was moved or deleted',confirm:'Delete this work and its local original file? This cannot be undone.',copied:'Prompt copied',copyFailed:'Copy failed. Select the prompt above to copy it manually.',count:(n,t)=>`Showing ${n} of ${t} works`}};
let language='zh',favoriteOnly=false,next=null,items=[],epoch=0,loadSequence=0,busy=false,selected=null,detailURL=null,detailEpoch=0;
const urls=new Set();const t=()=>strings[language];
try{language=localStorage.getItem('cc.media.language')==='en'?'en':'zh'}catch{}
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Local-Session':nonce,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error(String(r.status));return r}
function translate(){document.documentElement.lang=language==='zh'?'zh-CN':'en';$('language').value=language;for(const id of ['imagesLink','videoLink','title','intro','search','refresh','more','empty','detailTitle','download','copy','delete'])$(id).textContent=t()[id];$('query').placeholder=language==='en'?'Search scene descriptions…':'搜索画面描述…';for(const o of $('kind').options)o.textContent=t()[o.value];$('favorites').textContent=favoriteOnly?t().starred:t().favorite}
function clearGrid(){for(const u of urls)URL.revokeObjectURL(u);urls.clear();$('grid').replaceChildren();items=[]}
function card(item,version){const article=document.createElement('article');article.className='card';const visual=document.createElement('button');visual.className='visual';visual.setAttribute('aria-label',item.params.prompt);visual.onclick=()=>openDetail(item);const icon=document.createElement('span');icon.className='play';icon.textContent=item.media_type==='video'?'▷':'◇';visual.append(icon);const type=document.createElement('span');type.className='type';type.textContent=item.media_type==='video'?'MP4':'PNG';visual.append(type);
if(item.media_type==='image'&&item.available){observer.observe(visual);visual._load=async()=>{try{const b=await(await request('/gallery/media/'+item.job_id)).blob();if(version!==epoch)return;const u=URL.createObjectURL(b);urls.add(u);const img=document.createElement('img');img.alt=item.params.prompt;img.src=u;visual.replaceChildren(img,type)}catch{icon.textContent='◇'}}}
const body=document.createElement('div');body.className='body';const prompt=document.createElement('p');prompt.className='prompt';prompt.textContent=item.params.prompt;const meta=document.createElement('div');meta.className='meta';const label=document.createElement('span');label.textContent=new Date(item.created*1000).toLocaleDateString(language==='en'?'en-US':'zh-CN');const star=document.createElement('button');star.className='favorite';star.textContent=item.favorite?'★':'☆';star.setAttribute('aria-label',t().favorite);star.setAttribute('aria-pressed',String(item.favorite));star.onclick=async()=>{star.disabled=true;try{await request('/gallery/items/'+item.job_id,{action:'favorite',favorite:!item.favorite});item.favorite=!item.favorite;star.textContent=item.favorite?'★':'☆';star.setAttribute('aria-pressed',String(item.favorite));if(favoriteOnly)load()}catch{$('status').textContent=t().failed}finally{star.disabled=false}};meta.append(label,star);body.append(prompt,meta);article.append(visual,body);return article}
const observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){observer.unobserve(e.target);e.target._load?.()}},{rootMargin:'200px'});
async function load(append=false){if(append&&busy)return;const sequence=++loadSequence;const version=append?epoch:++epoch;busy=true;$('more').disabled=true;$('status').textContent=t().loading;if(!append){observer.disconnect();clearGrid();next=null}const q=new URLSearchParams({media_type:$('kind').value,query:$('query').value,favorites:favoriteOnly?'1':'0',limit:'24',offset:String(append?next||0:0)});try{const data=await(await request('/gallery/items?'+q)).json();if(sequence!==loadSequence)return;items.push(...data.items);for(const item of data.items)$('grid').append(card(item,version));next=data.next_offset;$('empty').hidden=items.length>0;$('status').textContent=t().count(items.length,data.total);$('more').hidden=next===null}catch{if(sequence===loadSequence){$('status').textContent=t().failed;$('more').hidden=true}}finally{if(sequence===loadSequence){busy=false;$('more').disabled=false}}}
function releaseDetail(){detailEpoch++;if(detailURL)URL.revokeObjectURL(detailURL);detailURL=null;const v=$('viewer').querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load()}$('viewer').replaceChildren();$('download').hidden=true}
async function openDetail(item){releaseDetail();selected=item;const version=detailEpoch;$('detailPrompt').textContent=item.params.prompt;const p=item.params,u=item.usage;$('detailMeta').textContent=[p.model_id||'qwen-image-2.1',`seed ${p.seed}`,`${p.steps} steps`,u.width&&u.height?`${u.width} × ${u.height}`:'',u.frames?`${u.frames} frames · ${u.fps} fps`:'',new Date(item.created*1000).toLocaleString()].filter(Boolean).join(' · ');$('star').textContent=item.favorite?t().starred:t().favorite;$('detailStatus').textContent=item.available?t().loading:t().missing;$('detail').showModal();if(!item.available)return;try{const blob=await(await request('/gallery/media/'+item.job_id)).blob();if(version!==detailEpoch)return;detailURL=URL.createObjectURL(blob);const media=document.createElement(item.media_type==='video'?'video':'img');media.src=detailURL;if(item.media_type==='video'){media.controls=true;media.playsInline=true}else media.alt=item.params.prompt;$('viewer').append(media);$('download').href=detailURL;$('download').download='cc-media-'+item.job_id+(item.media_type==='video'?'.mp4':'.png');$('download').hidden=false;$('detailStatus').textContent=''}catch{if(version===detailEpoch)$('detailStatus').textContent=t().missing}}
$('close').onclick=()=>$('detail').close();$('detail').onclose=releaseDetail;
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(selected.params.prompt);$('detailStatus').textContent=t().copied}catch{$('detailStatus').textContent=t().copyFailed}};
$('star').onclick=async()=>{const item=selected;$('star').disabled=true;try{await request('/gallery/items/'+item.job_id,{action:'favorite',favorite:!item.favorite});item.favorite=!item.favorite;$('star').textContent=item.favorite?t().starred:t().favorite;await load()}catch{$('detailStatus').textContent=t().failed}finally{$('star').disabled=false}};
$('delete').onclick=async()=>{if(!confirm(t().confirm))return;$('delete').disabled=true;try{await request('/gallery/items/'+selected.job_id,{action:'delete'});$('detail').close();await load()}catch{$('detailStatus').textContent=t().failed}finally{$('delete').disabled=false}};
$('filters').onsubmit=e=>{e.preventDefault();load()};$('kind').onchange=()=>load();$('refresh').onclick=()=>load();$('more').onclick=()=>load(true);$('favorites').onclick=()=>{favoriteOnly=!favoriteOnly;$('favorites').setAttribute('aria-pressed',String(favoriteOnly));translate();load()};$('language').onchange=()=>{language=$('language').value;try{localStorage.setItem('cc.media.language',language)}catch{}translate();load()};window.addEventListener('beforeunload',()=>{clearGrid();releaseDetail()});translate();load();
</script></body></html>
