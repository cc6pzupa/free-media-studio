name: Desktop installers

on:
  push:
    branches: [feature/installers-gallery]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            binary: dist/cc-media-studio/cc-media-studio.exe
          - os: macos-15-intel
            target: macos-intel
            binary: dist/CC Media Studio.app/Contents/MacOS/cc-media-studio
          - os: macos-15
            target: macos-arm64
            binary: dist/CC Media Studio.app/Contents/MacOS/cc-media-studio
          - os: ubuntu-22.04
            target: linux-x86_64
            binary: dist/cc-media-studio/cc-media-studio
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-build.txt
      - name: Test client and gallery
        run: python -m unittest discover -s tests -v
      - name: Test browser logic
        run: node --test tests/test_ui.cjs tests/test_video_ui.cjs tests/test_gallery_ui.cjs
      - name: Freeze native client
        run: python -m PyInstaller --noconfirm --clean packaging/cc-media-studio.spec
      - name: Smoke test frozen client and independent worker
        run: python packaging/smoke.py "${{ matrix.binary }}"
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = (Get-ChildItem release/*setup.exe).FullName
          $location = Join-Path $env:RUNNER_TEMP 'cc-media-installed'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$location") -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          python packaging/smoke.py "$location/cc-media-studio.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: macOS Intel and Apple Silicon installers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release build/dmg
          architecture=arm64
          if [ '${{ matrix.target }}' = 'macos-intel' ]; then architecture=x86_64; fi
          lipo -verify_arch "$architecture" 'dist/CC Media Studio.app/Contents/MacOS/cc-media-studio'
          productbuild --component 'dist/CC Media Studio.app' /Applications 'release/CC-Media-Studio-0.9.0-${{ matrix.target }}.pkg'
          pkgutil --payload-files 'release/CC-Media-Studio-0.9.0-${{ matrix.target }}.pkg' > build/pkg-contents.txt
          cp -R 'dist/CC Media Studio.app' build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname 'CC Media Studio' -srcfolder build/dmg -ov -format UDZO 'release/CC-Media-Studio-0.9.0-${{ matrix.target }}.dmg'
          hdiutil verify 'release/CC-Media-Studio-0.9.0-${{ matrix.target }}.dmg'
      - name: Linux deb and rpm installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python packaging/linux_packages.py
          dpkg-deb --info release/*.deb
          rpm -qip release/*.rpm
          sudo dpkg -i release/*.deb
          python packaging/smoke.py /opt/cc-media-studio/cc-media-studio
      - name: Checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          root=Path('release')
          files=sorted(p for p in root.iterdir() if p.is_file())
          assert files, 'No installers were produced'
          (root/'SHA256SUMS-${{ matrix.target }}.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  preview-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/installers-gallery'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Publish installer preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="v0.9.0-rc.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title 'CC Media Studio 0.9.0 preview' --notes 'Windows x64 setup, separate macOS Intel and Apple Silicon dmg/pkg, and Linux x86_64 deb/rpm. Includes a local image/video gallery with search, favorites, playback and download. Python is bundled. Windows/macOS packages are unsigned; Apple notarization and trusted publisher signing are not configured.'

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Publish tagged installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "CC Media Studio $GITHUB_REF_NAME" --generate-notes
