name: Client tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install client dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Python client
        run: python -m unittest discover -s tests -v
      - name: Check the standalone Notebook
        run: python -c "import nbformat; n=nbformat.read('kaggle_standalone.ipynb',as_version=4); nbformat.validate(n); compile(n.cells[2].source,'kaggle_standalone.ipynb','exec')"
      - name: Check the video Notebook
        run: python -c "import nbformat; n=nbformat.read('kaggle_video.ipynb',as_version=4); nbformat.validate(n); [compile(c.source,'kaggle_video.ipynb','exec') for c in n.cells if c.cell_type=='code']"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test GUI logic
        run: node --test tests/test_ui.cjs tests/test_video_ui.cjs

  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-mcp.txt
      - run: python -m unittest discover -s tests -v
