<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CC Media Studio · Video</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#24243b;background:#f6f5fb}*{box-sizing:border-box}body{margin:0}header{height:78px;background:white;border-bottom:1px solid #e7e5ef;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}a{color:#6650d9;text-decoration:none}h1{font-size:21px}main{max-width:1320px;margin:42px auto;padding:0 28px}.intro{margin-bottom:26px}.intro h2{font-size:32px;margin:8px 0}.intro p,.muted{color:#77768b}.layout{display:grid;grid-template-columns:390px 1fr;gap:24px}.card{background:white;border:1px solid #e7e5ef;border-radius:18px;padding:26px}label{display:block;font-size:13px;font-weight:600;margin:19px 0 8px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #dedbe9;border-radius:9px;padding:12px;background:white}textarea{height:160px;resize:vertical;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,.download{border:0;border-radius:10px;background:#7055e8;color:white;padding:13px 18px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.generate{margin-top:24px;width:100%;font-weight:600}video{width:100%;max-height:510px;border-radius:12px;background:#151322}.empty{min-height:350px;border:1px dashed #ded9ed;border-radius:12px;display:grid;place-items:center;text-align:center;padding:30px;background:#faf9fd}.status{line-height:1.7;min-height:48px;white-space:pre-wrap;overflow-wrap:anywhere}.track{height:6px;background:#eeebf7;border-radius:9px;overflow:hidden;margin:20px 0}.track div{height:100%;background:#8065ed;width:0;transition:width .3s}.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px}.download[hidden],video[hidden],.empty[hidden]{display:none}.tag{color:#7055e8;font-size:12px;letter-spacing:.1em}#lang{width:auto;padding:7px;border-radius:7px}#meta{line-height:1.7;overflow-wrap:anywhere}footer{margin-top:30px;color:#8d899e;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}main{margin:25px auto;padding:0 16px}header{padding:0 18px}.intro h2{font-size:27px}.card{padding:20px}}
</style></head><body><header><h1>CC Media Studio <span class="tag">VIDEO PREVIEW</span></h1><div><a href="/" id="back">图片与账号设置</a>　<select id="lang" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></div></header><main><div class="intro"><span class="tag">YOUR NEXT FRAME</span><h2 id="title">让画面开始流动。</h2><p id="subtitle">三档视频模型 · Kaggle 双 T4 · MP4 预览与下载</p></div><div class="layout"><section class="card"><label for="model" id="modelLabel">视频模型</label><select id="model"></select><p id="modelHint" class="muted"></p><label for="prompt" id="promptLabel">画面与动作描述</label><textarea id="prompt" placeholder="An adult anime catgirl reading by a window. Her hair moves gently in the breeze. Slow camera movement."></textarea><div class="row"><div><label for="steps" id="stepsLabel">生成步数</label><input id="steps" type="number" min="1" max="50"></div><div><label for="seed" id="seedLabel">随机种子</label><input id="seed" type="number" min="0" max="2147483647" value="42"></div></div><label for="frames" id="framesLabel">帧数</label><select id="frames"><option>9</option><option>17</option><option selected>33</option><option>49</option><option>65</option><option>81</option></select><button id="generate" class="generate">生成视频</button><p class="muted" id="firstHint">先在图片工作台保存账号。首次使用自动下载视频模型。</p></section><section class="card"><div id="empty" class="empty"><div><h2 id="emptyTitle">下一段故事，从这里开始</h2><p class="muted" id="emptyHint">完成后可播放、循环预览和保存 MP4。</p></div></div><video id="video" controls loop playsinline hidden></video><div class="track"><div id="bar"></div></div><p id="status" class="status">准备就绪</p><p id="meta" class="muted"></p><div class="actions"><a id="download" class="download" hidden>保存 MP4</a><a href="/" id="imageLink">返回图片工作台 ↗</a></div></section></div><footer>CC MEDIA STUDIO · VIDEO DEVELOPMENT BRANCH</footer></main><script>
const nonce='__NONCE__',$=id=>document.getElementById(id),key='cc.media.video.job.v1';
let models=[],active=null,objectURL=null,timer=null;
const text={zh:{back:'图片与账号设置',title:'让画面开始流动。',subtitle:'三档视频模型 · Kaggle 双 T4 · MP4 预览与下载',modelLabel:'视频模型',promptLabel:'画面与动作描述',stepsLabel:'生成步数',seedLabel:'随机种子',framesLabel:'帧数',generate:'生成视频',firstHint:'先在图片工作台保存账号。首次使用自动下载视频模型。',emptyTitle:'下一段故事，从这里开始',emptyHint:'完成后可播放、循环预览和保存 MP4。',download:'保存 MP4',imageLink:'返回图片工作台 ↗'},en:{back:'Images & account',title:'Set your scene in motion.',subtitle:'Three video tiers · Kaggle dual T4 · MP4 preview and download',modelLabel:'Video model',promptLabel:'Scene and motion',stepsLabel:'Steps',seedLabel:'Seed',framesLabel:'Frames',generate:'Generate video',firstHint:'Save your account in the image workspace first. First use downloads the video model.',emptyTitle:'Your next story starts here',emptyHint:'Play, loop and save your MP4 when it is ready.',download:'Save MP4',imageLink:'Image workspace ↗'}};
function translate(){const lang=$('lang').value;document.documentElement.lang=lang==='zh'?'zh-CN':'en';for(const [id,value]of Object.entries(text[lang]))$(id).textContent=value}
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Local-Session':nonce,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok){let data;try{data=await r.json()}catch{}throw Error(data?.error?.message||'Request failed')}return r}
function selectModel(){const p=models.find(x=>x.id===$('model').value);if(!p)return;$('steps').value=p.default_steps;$('steps').disabled=!!p.fixed_steps;$('modelHint').textContent=`${p.width} × ${p.height} · ${p.fps} FPS · ${p.tier}`}
function remember(id){active=id;try{id?localStorage.setItem(key,id):localStorage.removeItem(key)}catch{}}
function showProgress(job){const en=$('lang').value==='en',labels=en?{installing:'Installing video environment',encoding:'Encoding prompt',generating:'Generating video',decoding:'Decoding frames',exporting:'Saving MP4',complete:'Video ready'}:{installing:'正在安装视频环境',encoding:'正在编码提示词',generating:'正在生成视频',decoding:'正在解码画面',exporting:'正在保存 MP4',complete:'视频已完成'};let label=labels[job.state==='complete'?'complete':job.phase]||job.message||job.phase||job.state;let percent=job.percent||8;if(job.phase==='generating'&&job.steps>0){label+=` · ${job.step}/${job.steps}`;percent=100*job.step/job.steps}if(job.phase==='decoding'||job.phase==='exporting')percent=100;$('status').textContent=label;$('bar').style.width=Math.min(100,job.state==='complete'?100:percent)+'%'}
async function poll(){if(!active)return;clearTimeout(timer);try{const job=await(await request('/video/jobs/'+active)).json();showProgress(job);if(job.state==='complete'){const blob=await(await request('/video/jobs/'+active+'/content')).blob();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(blob);$('video').src=objectURL;$('video').hidden=false;$('empty').hidden=true;$('download').href=objectURL;$('download').download='cc-media-'+active+'.mp4';$('download').hidden=false;const u=job.usage;$('meta').textContent=`${u.model_id} · ${u.frames} frames · ${u.fps} FPS · ${u.parallel_strategy} · ${u.request_seconds}s`;remember(null);$('generate').disabled=false;return}if(['error','interrupted'].includes(job.state)){remember(null);$('generate').disabled=false;return}}catch(error){$('status').textContent=error.message+' · '+active}timer=setTimeout(poll,2000)}
$('generate').onclick=async()=>{if(active)return;$('generate').disabled=true;try{const job=await(await request('/video/jobs',{prompt:$('prompt').value,model_id:$('model').value,steps:Number($('steps').value),seed:Number($('seed').value),frames:Number($('frames').value),request_id:crypto.randomUUID()})).json();remember(job.job_id);await poll()}catch(error){$('status').textContent=error.message;$('generate').disabled=false}};
$('model').onchange=selectModel;$('lang').onchange=translate;
(async()=>{try{models=(await(await request('/video/models')).json()).models;for(const p of models){const option=document.createElement('option');option.value=p.id;option.textContent=p.name;$('model').append(option)}$('model').value='wan21-t2v-1.3b';selectModel();translate();const saved=localStorage.getItem(key);if(saved&&/^[a-f0-9]{32}$/.test(saved)){active=saved;$('generate').disabled=true;await poll()}}catch(error){$('status').textContent=error.message}})();
</script></body></html>
